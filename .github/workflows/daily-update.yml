name: Aggiornamento quotidiano rassegna

on:
  schedule:
    # 05:00 UTC = 06:00/07:00 ora italiana a seconda dell'ora legale
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch RSS news
        run: npm run fetch
        timeout-minutes: 5

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch scraped news (fonti pubbliche senza RSS)
        run: npm run fetch:scraped
        timeout-minutes: 5

      - name: Fetch authenticated news (Eutekne, MySolution)
        run: npm run fetch:auth
        timeout-minutes: 5
        env:
          EUTEKNE_USERNAME: ${{ secrets.EUTEKNE_USERNAME }}
          EUTEKNE_PASSWORD: ${{ secrets.EUTEKNE_PASSWORD }}
          MYSOLUTION_USERNAME: ${{ secrets.MYSOLUTION_USERNAME }}
          MYSOLUTION_PASSWORD: ${{ secrets.MYSOLUTION_PASSWORD }}

      - name: Sintesi LLM (Claude)
        run: npm run summarize
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: aggiornamento rassegna quotidiana"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
